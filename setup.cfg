[metadata]
name = casambi-bt-reconnect
version = 0.3.3
author = lkempf
author_email = pypi@lukas-kempf.de
description = Fork of casambi-bt with handshake timeouts. Distributed under a distinct name so Home Assistant does not treat an installed casambi-bt as satisfying it; the module is still imported as CasambiBt.
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/Astogems/casambi-bt
classifiers =
    Programming Language :: Python :: 3.12
    License :: OSI Approved :: Apache Software License
    Operating System :: OS Independent
    Development Status :: 4 - Beta

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.11
install_requires =
    bleak>=2.1.0
    cryptography>=40.0.0
    httpx>=0.25
    bleak_retry_connector >= 3.6.0
    anyio>=4.10.0


[options.packages.find]
where = src
